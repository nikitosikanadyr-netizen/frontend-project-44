<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Система управления клиентами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <!-- ШАПКА -->
    <div class="header">
        <div class="logo-circle">
            <span class="logo-text">skb.</span>
        </div>
        <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Введите запрос" autocomplete="off">
        </div>
    </div>

    <!-- ЗАГОЛОВОК -->
    <div class="page-title">
        <h1>Клиенты</h1>
    </div>

    <!-- ТАБЛИЦА -->
    <div class="table-container" id="tableContainer">
        <div class="loader-overlay" id="tableLoader" style="display: none;">
            <div class="spinner"></div>
        </div>
        <table class="clients-table" id="clientTable">
            <thead>
                <tr>
                    <th data-sort="id">ID</th>
                    <th data-sort="fio">Фамилия Имя Отчество</th>
                    <th data-sort="createdAt">Дата и время создания</th>
                    <th data-sort="updatedAt">Последние изменения</th>
                    <th>Контакты</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" class="text-center">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- КНОПКА ДОБАВЛЕНИЯ -->
    <div class="add-button-wrapper">
        <button class="add-client-btn" id="addClientBtn">+ Добавить клиента</button>
    </div>
</div>

<div id="modalRoot"></div>

<script type="module" src="main.js"></script>
</body>
</html>
